# .github/workflows/staging-crons.yml — rotinas agendadas do STAGING.
# O Netlify não executa funções agendadas em deploys de branch, então o
# coletor da Rota A (novas tentativas a cada 15 min) e a pré-análise por IA
# da Rota B do staging são chamados daqui. Só toca o staging — a produção usa o schedule do netlify.toml.
# O agendamento do GitHub só roda a partir do branch padrão (main).
# Secret: STAGING_CRON_SECRET (= CRON_SECRET do contexto staging no Netlify).

name: Staging — rotinas agendadas

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  rota-a-coletor:
    name: Coletor da Rota A (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Dispara o coletor background
        run: |
          # 28/10: a Netlify devolveu 500 passageiro nas duas funções no mesmo
          # segundo — até 3 tentativas (30 s entre elas) antes de acusar falha
          for tentativa in 1 2 3; do
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.STAGING_CRON_SECRET }}" \
              "https://staging--sigec-elos.netlify.app/.netlify/functions/homolog-collect-background")
            echo "homolog-collect-background (staging), tentativa $tentativa: HTTP $response"
            # background function responde 202 (aceito)
            if [ "$response" = "202" ] || [ "$response" = "200" ]; then exit 0; fi
            [ $tentativa -lt 3 ] && sleep 30
          done
          exit 1

  rota-b-pre-analise:
    name: Pré-análise por IA da Rota B (staging)
    runs-on: ubuntu-latest
    steps:
      - name: Dispara o processador background
        run: |
          # 28/10: a Netlify devolveu 500 passageiro nas duas funções no mesmo
          # segundo — até 3 tentativas (30 s entre elas) antes de acusar falha
          for tentativa in 1 2 3; do
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${{ secrets.STAGING_CRON_SECRET }}" \
              "https://staging--sigec-elos.netlify.app/.netlify/functions/homolog-ai-review-background")
            echo "homolog-ai-review-background (staging), tentativa $tentativa: HTTP $response"
            if [ "$response" = "202" ] || [ "$response" = "200" ]; then exit 0; fi
            [ $tentativa -lt 3 ] && sleep 30
          done
          exit 1
