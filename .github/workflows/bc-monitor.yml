# .github/workflows/bc-monitor.yml
# BC Report — monitoramento mensal (Estágio 10): revalida a rota A (grátis)
# dos CNPJs com relatório recente, detecta mudança em listas restritivas e
# lista certidões vencendo; alerta por e-mail se configurado em bc_config
# 'monitor_alert_email'. Segredos: CRON_SECRET, SITE_URL.

name: BC Report — Monitoramento Mensal

on:
  schedule:
    - cron: '0 9 1 * *'   # dia 1 às 09:00 UTC = 06:00 BRT
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disparar monitoramento (background function)
        run: |
          set -euo pipefail
          curl -sf -X POST "${{ secrets.SITE_URL }}/.netlify/functions/bc-monitor-background" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" -d '{}' -o /dev/null -w 'HTTP %{http_code}\n'
