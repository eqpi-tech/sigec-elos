# Comunicados de go-live de cliente (29/10/2026; 1º uso: VIXPAR, go-live 04/11).
# Calendário em scripts/comunicados_golive/enviar.py (CALENDARIO): 30/10 e 03/11.
# Travas: a lista precisa estar validada com o cliente (--validar) e o manual
# público no ar; senão o job falha e o GitHub avisa. Quem já recebeu não recebe
# de novo; excluídos (participantes dos testes) nunca recebem.
# Secrets: MIGRACAO_DB_URL (banco de produção) e RESEND_API_KEY.
name: Go-live de cliente — comunicados

on:
  # O GitHub atrasa agendamentos em até ~4h30: o 1º disparo é de madrugada e o
  # script espera até as 09:00 de Brasília; os outros dois são reserva (só
  # completam quem faltou — quem já recebeu não recebe de novo).
  schedule:
    - cron: '7 7 30 10 *'      # 04:07 BRT — VIX comunicado 1 (espera até 09:00)
    - cron: '7 11 30 10 *'     # 08:07 BRT — reserva
    - cron: '7 13 30 10 *'     # 10:07 BRT — reserva
    - cron: '7 7 3 11 *'       # 04:07 BRT — VIX comunicado 2 (espera até 09:00)
    - cron: '7 11 3 11 *'      # 08:07 BRT — reserva
    - cron: '7 13 3 11 *'      # 10:07 BRT — reserva
  workflow_dispatch:

concurrency: { group: comunicados-golive, cancel-in-progress: false }

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cliente Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Envia o comunicado de hoje
        env:
          MIGRACAO_DB_URL: ${{ secrets.MIGRACAO_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/comunicados_golive/enviar.py --agendado
