# Comunicados da migração HOC → ELOS (13/10/2026) — calendário aprovado pelo Luiz
# em scripts/migracao_hoc/enviar_comunicado.py (CALENDARIO). Roda às 09h de
# Brasília nas datas do calendário; o script decide qual comunicado é o de hoje.
# Travas: o comunicado 2 só vai para quem tem conta + link de senha; os 3 e 4 só
# saem com a página Ajuda no ar. Faltou algo → o job falha e manda e-mail de
# alerta (app_settings 'alertas_comunicados'; 06/11 — a falha do B1 em 04/11
# só avisou a conta do GitHub e ninguém viu).
# Quem já recebeu nunca recebe de novo (hoc_migration_contacts.envios).
# Secrets: MIGRACAO_DB_URL (banco de produção) e RESEND_API_KEY.
name: Migração HOC — comunicados

on:
  # O GitHub atrasa agendamentos em horas e às vezes nem dispara (visto em
  # 30/10 e 03/11): reservas às 12:07 e 15:07 BRT só completam quem faltou.
  schedule:
    - cron: '7 12 14-16 10 *'        # 09:07 BRT — A2, A3, A4
    - cron: '7 12 4,11,18,20 11 *'   # 09:07 BRT — B1, B2, B3, B4
    - cron: '7 15 11,18,20 11 *'     # 12:07 BRT — reserva B2, B3, B4
    - cron: '7 18 11,18,20 11 *'     # 15:07 BRT — reserva B2, B3, B4
  workflow_dispatch:
    inputs:
      campanha:
        description: 'Campanha (A ou B) — vazio = comunicado do calendário de hoje'
        required: false
      onda:
        description: 'Comunicado (1 a 4)'
        required: false

concurrency: { group: migracao-comunicados, cancel-in-progress: false }

jobs:
  enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cliente Postgres
        # 11/11: o B2 falhou porque o espelho do Ubuntu não respondeu nesta etapa
        # (troca do ubuntu-latest para o Ubuntu 26). A imagem 24.04 já traz o psql;
        # só instala se faltar, com nova tentativa.
        run: |
          command -v psql && exit 0
          for i in 1 2 3; do sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client && exit 0; sleep 20; done
          exit 1
      - name: Envia
        env:
          MIGRACAO_DB_URL: ${{ secrets.MIGRACAO_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAMPANHA: ${{ inputs.campanha }}
          ONDA: ${{ inputs.onda }}
        run: |
          if [ -n "$CAMPANHA" ] && [ -n "$ONDA" ]; then
            python scripts/migracao_hoc/enviar_comunicado.py --campanha "$CAMPANHA" --onda "$ONDA" --enviar --sim
          else
            python scripts/migracao_hoc/enviar_comunicado.py --agendado
          fi
      - name: Alerta de falha
        if: failure()
        env:
          MIGRACAO_DB_URL: ${{ secrets.MIGRACAO_DB_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os, sys, json
          sys.path.insert(0, 'scripts/comunicados_golive')
          from enviar import psql, resend, moldura
          try:
              v = psql("select value::text from app_settings where key='alertas_comunicados'").strip()
              para = json.loads(v) if v else []
          except BaseException:                         # banco fora: avisa ao menos o suporte
              para = []
          para = para or ['suporte@eqpitech.com.br']
          for e in para:
              resend(e, '[MIGRAÇÃO HOC] ALERTA — o envio do comunicado falhou',
                     moldura(None, 'Migração HOC · acompanhamento interno',
                             f'<p>O job de comunicados da migração falhou ou ficou incompleto. Veja o log: <a href="{os.environ["RUN_URL"]}">{os.environ["RUN_URL"]}</a></p>'
                             '<p>Quem já recebeu não recebe de novo: rodar o workflow outra vez só completa o que faltou.</p>'))
          EOF
