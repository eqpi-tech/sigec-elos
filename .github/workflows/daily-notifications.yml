# .github/workflows/daily-notifications.yml
# Agendado às 05:17 BRT (08:17 UTC): o GitHub vinha atrasando ~7h o horário
# das 08:00 (rodava ~15h). Minuto quebrado evita o pico da hora cheia.
# Chama a Netlify Function check-expiring-docs
# Adicione CRON_SECRET e SITE_URL nos GitHub Secrets

name: Daily — Notificações de Documentos Vencendo

on:
  schedule:
    - cron: '17 8 * * *'   # 08:17 UTC = 05:17 BRT
  workflow_dispatch:        # Permite rodar manualmente pelo GitHub Actions

jobs:
  check-expiring-docs:
    name: Verifica documentos vencendo
    runs-on: ubuntu-latest
    steps:
      - name: Chama Netlify Function
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SITE_URL }}/.netlify/functions/check-expiring-docs")
          echo "HTTP status: $response"
          if [ "$response" != "200" ]; then
            echo "❌ Falha na notificação (HTTP $response)"
            exit 1
          fi
          echo "✅ Notificações processadas com sucesso"

  invitation-reminders:
    name: Lembretes de convite (fornecedores sem cadastro)
    runs-on: ubuntu-latest
    steps:
      - name: Chama Netlify Function
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.SITE_URL }}/.netlify/functions/invitation-reminders")
          echo "invitation-reminders: HTTP $response"

      - name: Lembretes de pendências (docs + questionário, a cada 3 dias)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/.netlify/functions/pending-docs-reminders-background")
          echo "pending-docs-reminders: HTTP $response"
          # background function responde 202 (aceito) e processa por até 15 min
          if [ "$response" != "202" ] && [ "$response" != "200" ]; then
            echo "❌ Falha ao disparar lembretes (HTTP $response)"
            exit 1
          fi

  exception-letters:
    name: Cartas de exceção (aviso 7 dias antes e vencimento → suspensão)
    runs-on: ubuntu-latest
    steps:
      - name: Chama Netlify Function
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/.netlify/functions/exception-letters-expire")
          echo "exception-letters-expire: $response"
          if [ "$(echo "$response" | tail -1)" != "200" ]; then
            echo "❌ Falha na rotina das cartas de exceção"
            exit 1
          fi

  selos-vencimento:
    name: Vencimento dos selos ELOS (plano encerrado)
    runs-on: ubuntu-latest
    steps:
      - name: Chama Netlify Function
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/.netlify/functions/seals-expire")
          echo "seals-expire: $response"
          if [ "$(echo "$response" | tail -1)" != "200" ]; then
            echo "❌ Falha no vencimento dos selos"
            exit 1
          fi

  stripe-conciliacao:
    name: Conciliação de pagamentos do Stripe (boleto pago sem aviso)
    runs-on: ubuntu-latest
    steps:
      - name: Chama Netlify Function
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/.netlify/functions/stripe-reconcile")
          echo "stripe-reconcile: $response"
          if [ "$(echo "$response" | tail -1)" != "200" ]; then
            echo "❌ Falha na conciliação do Stripe"
            exit 1
          fi

  nfe-emissao:
    name: Emissão de NFSe pendentes (varredura)
    runs-on: ubuntu-latest
    steps:
      - name: Chama Netlify Function
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/.netlify/functions/nfe-emit-pending")
          echo "resultado: $response"
