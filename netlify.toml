[build]
  command   = "npm run build"
  publish   = "dist"
[build.environment]
  NODE_VERSION = "20"
[functions]
  directory  = "netlify/functions"
  node_bundler = "esbuild"

# ── Ambientes ────────────────────────────────────────────────────────────
# ELOS_ENV distingue produção de staging/preview no código (hoje: trava de
# e-mails em lib/mail_guard.js — fora de produção nada sai para o
# destinatário real). Os VALORES sensíveis do staging (URL/keys do Supabase
# de staging, Stripe de teste, MAIL_TEST_INBOX) ficam no painel do Netlify
# com escopo para o branch — nunca no repositório. Deploys de branch não
# executam funções agendadas, então o cron do BC Report só roda em produção.
[context.production.environment]
  ELOS_ENV = "production"
  # Automação em produção (promoção de 07/10/2026) — só processos ORIGINADOS NO
  # ELOS (patch_121: processo/documento do HOC nunca entra). Nasce DESLIGADA;
  # ligar é trocar "false" por "true" aqui (commit + deploy). Rota A = coleta
  # nas fontes oficiais; Rota B = pré-análise por IA (Alvará/Licença).
  ROUTE_A_ENABLED = "false"
  VITE_ROUTE_A_ENABLED = "false"
  ROUTE_B_ENABLED = "false"
  VITE_ROUTE_B_ENABLED = "false"
  ROUTE_B_DAILY_LIMIT_BRL = "10"

[context."staging".environment]
  ELOS_ENV = "staging"
  # homologação automática, fase 1 (SPEC_HOMOLOGACAO_AUTOMATICA.md) — só staging
  ROUTE_A_ENABLED = "true"
  VITE_ROUTE_A_ENABLED = "true"
  # Rota B — pré-análise por IA dos documentos enviados (SPEC_ROTA_B.md) — só staging.
  # Econômica desde 29/09: modo lote (50% do preço), esforço 'low', regra do
  # cliente em cache e teto de R$ 5/dia. Pausar: ROUTE_B_ENABLED = "false".
  ROUTE_B_ENABLED = "true"
  VITE_ROUTE_B_ENABLED = "true"
  ROUTE_B_DAILY_LIMIT_BRL = "5"
  # MFA desligado para os testes no staging (28/09). NUNCA copiar para
  # [context.production] — e o código ignora a flag no domínio de produção.
  VITE_MFA_DISABLED = "true"

[context.deploy-preview.environment]
  ELOS_ENV = "preview"

# BC Report: fila processada 1/min EM PRODUÇÃO pelo wrapper agendado
# (function com schedule não aceita POST externo — 403 — por isso o gatilho
# da tela usa bc-report-worker.js, HTTP, e o cron usa bc-report-cron.js;
# branch deploys não executam schedules)
[functions."bc-report-cron"]
  schedule = "* * * * *"

# Rota A: novas tentativas da coleta automática (inerte sem ROUTE_A_ENABLED)
[functions."homolog-collect-cron"]
  schedule = "*/15 * * * *"

# O worker background gera o PDF (Playwright): o binário do chromium lambda
# não pode ser bundlado pelo esbuild — vai como módulo externo + arquivos
[functions."bc-report-worker-background"]
  external_node_modules = ["@sparticuz/chromium", "playwright-core"]
  included_files = ["node_modules/@sparticuz/chromium/bin/**"]
[[redirects]]
  from = "/pesquisa.html"
  to   = "/pesquisa.html"
  status = 200
  force  = false

# Rota de reset de senha — deve ser SPA (index.html) para o hash token funcionar
[[redirects]]
  from = "/redefinir-senha"
  to   = "/index.html"
  status = 200
# Portal da Appian Capital mudou de endereço (05/10/2026): link antigo continua funcionando
[[redirects]]
  from = "/portal/atlantic-nickel"
  to   = "/portal/appian"
  status = 301
  force  = true
[[redirects]]
  from = "/portal/atlantic-nickel/*"
  to   = "/portal/appian/:splat"
  status = 301
  force  = true
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "SAMEORIGIN"
    X-Content-Type-Options    = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/pesquisa.html"
  [headers.values]
    X-Frame-Options = ""
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
